version: "3.9"

services:

  backend:

    build: .

    container_name: docintel-ai

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    environment:
      OLLAMA_HOST: http://host.docker.internal:11434

    restart: unless-stopped

    extra_hosts:
      - "host.docker.internal:host-gateway"